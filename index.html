<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>look at console time run display</h1>
    <script>
        class Clock {
            constructor() {
                this.date = new Date();
            }

            // A GETTER for the formatted time string
            get currentTime() {
                // Cleaner way to add leading zeros using padStart
                // 👇 Fixed: added "this." before date
                let hours = String(this.date.getHours()).padStart(2, '0');
                let mins = String(this.date.getMinutes()).padStart(2, '0');
                let secs = String(this.date.getSeconds()).padStart(2, '0');
                return `${hours}:${mins}:${secs}`;
            }

            // A GETTER for the formatted date string
            get currentDate() {
                // Day and Month strings
                let dayName = this.date.toLocaleDateString('en-US', { weekday: 'long' });
                let monthName = this.date.toLocaleDateString('en-US', { month: 'long' });
                let today = this.date.getDate();
                return `${dayName}, ${monthName} ${today}`;


            }


           render() {
                this.date = new Date();
                console.log(`Time: ${this.currentTime} | Date: ${this.currentDate}`);
            }

            start() {
                this.render(); // Run once immediately
                this.timer = setInterval(() => this.render(), 1000); // Then every 1 second
            }

            stop() {
                clearInterval(this.timer);
            }
        }


        let obj1 = new Clock();
        //  console.log(obj1);
        // 👇 YOU NEED TO CALL START HERE!
      //  obj1.render();
      // 1. Start the clock
        obj1.start();
        // Stop the clock after 5000 milliseconds (5 seconds)
        setTimeout(() => {
            obj1.stop();
            console.log("Clock stopped!");
        }, 5000);
    </script>
</body>

</html>
